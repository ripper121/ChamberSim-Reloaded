name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - pwa/**
      - data/**
      - resources/icons/**
      - .github/workflows/deploy-pwa-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        working-directory: pwa
        run: npm ci

      - name: Run unit tests without unavailable release fixture
        working-directory: pwa
        run: |
          npm test -- \
            --exclude src/lib/loadfile.test.ts \
            --exclude src/lib/loadedit.test.ts \
            --exclude src/lib/siminput.test.ts \
            --exclude src/lib/solver.test.ts
            
      - name: Build PWA for project Pages
        working-directory: pwa
        env:
          VITE_BASE_PATH: /ChamberSim-Reloaded/
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload PWA artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pwa/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
